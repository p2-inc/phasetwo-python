name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv build
      - name: Import check
        run: uv run --no-project --with dist/*.whl python -I -c 'from phasetwo import OrganizationsApi, Configuration; print("ok")'

  # Runs examples/quickstart.py (the README's code) against Phase Two Keycloak.
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Start Phase Two Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_RELATIVE_PATH=/auth \
            quay.io/phasetwo/phasetwo-keycloak:26.5.6 start-dev
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv build
      - name: Wait for Keycloak
        run: |
          timeout 240 bash -c 'until curl -sf http://localhost:8080/auth/realms/master >/dev/null; do sleep 3; done' \
            || { docker logs keycloak | tail -50; exit 1; }
      - name: Create a realm, service account and user
        run: .github/scripts/keycloak-setup.sh http://localhost:8080/auth >> "$GITHUB_ENV"
      - name: Quick start
        run: uv run --no-project --with dist/*.whl python -I examples/quickstart.py

  # One stable check name for branch protection, whatever the matrix above holds.
  # Add new jobs to needs.
  ci-ok:
    if: always()
    needs: [build, examples]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false ]
