# On each merge to main, publish the next version of phasetwo-sdk to PyPI.
# Versions follow the API version in sdk-generator.json (the spec's info.version),
# shared by all Phase Two SDKs: the first release for API X.Y is X.Y.0, and later
# releases (e.g. SDK-only fixes) are X.Y.1, X.Y.2, ... based on this repo's tags.
# The version is set at build time and tagged vX.Y.Z; pyproject.toml's version in
# git isn't updated. Skip with [ci skip] in the commit message.
#
# Uses PyPI trusted publishing: add this repo, workflow (release.yml) and
# environment (pypi) as a trusted publisher for phasetwo-sdk on pypi.org.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Choose version
        id: version
        run: |
          api=$(sed -n 's/.*"apiVersion": *"\([^"]*\)".*/\1/p' sdk-generator.json)
          [ -n "$api" ] || { echo "::error::no apiVersion in sdk-generator.json"; exit 1; }
          mm=${api%.*}
          last=$(git tag --list "v$mm.*" --sort=-v:refname | head -1)
          if [ -z "$last" ]; then next="$mm.0"; else next="$mm.$(( ${last##*.} + 1 ))"; fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - run: uv version "${{ steps.version.outputs.next }}"
      - run: uv build
      - name: Smoke test the wheel
        run: uv run --no-project --with dist/*.whl python -I -c 'import phasetwo; print(phasetwo.__version__)'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: v${{ needs.build.outputs.next }}
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --verify-tag dist/*
