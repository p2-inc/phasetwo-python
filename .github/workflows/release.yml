# On each merge to main, publish the next version of phasetwo-sdk to PyPI: a minor
# bump if the merged PR is labelled semver:minor (set by phasetwo-sdk-generator for
# breaking spec changes), otherwise a patch bump of the version currently on PyPI.
# The first release (nothing on PyPI yet) uses the version in pyproject.toml. The
# release is tagged vX.Y.Z; pyproject.toml's version in git isn't updated.
# Skip with [ci skip] in the commit message.
#
# Uses PyPI trusted publishing: add this repo, workflow (release.yml) and
# environment (pypi) as a trusted publisher for phasetwo-sdk on pypi.org.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Choose version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(curl -fsS https://pypi.org/pypi/phasetwo-sdk/json | jq -r .info.version || true)
          if [ -z "$current" ]; then
            next=$(uv version --short)
          else
            IFS=. read -r major minor patch <<< "$current"
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
            if grep -qx 'semver:minor' <<< "$labels"; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - run: uv version "${{ steps.version.outputs.next }}"
      - run: uv build
      - name: Smoke test the wheel
        run: uv run --no-project --with dist/*.whl python -I -c 'import phasetwo; print(phasetwo.__version__)'
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: v${{ needs.build.outputs.next }}
        run: |
          git tag "$NEXT" "$GITHUB_SHA"
          git push origin "$NEXT"
          gh release create "$NEXT" --generate-notes --verify-tag dist/*
